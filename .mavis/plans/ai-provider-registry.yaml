  - id: ai-provider-registry-impl
    title: 'Implementar ProviderDefinition declarativo e migrar providers existentes'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      ## Contexto

      O projeto em `C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6` é um monorepo pnpm. O app principal é `apps/web` (Next.js 16 + AI SDK Vercel v6). O subsistema de providers de IA vive em `apps/web/src/lib/ai/`. Hoje os providers são funções soltas:

        - `providers/anthropic.ts` (6 linhas, função `buildAnthropic(modelId)` que retorna `anthropic(modelId)`).
        - `providers/minimax.ts` (24 linhas, `buildMinimax(modelId)` que cria um `createAnthropic` com `baseURL` customizado).
        - `models.ts` define um array hardcoded `AI_MODELS: readonly AiModelDefinition[]` com 4 entradas (claude-sonnet-4-6, claude-haiku-4-5, minimax-m2.7, minimax-m2.7-highspeed), e expõe `getModel`, `getAvailableModels`, `DEFAULT_MODEL_ID`, `AiProvider`, `AiModelDefinition`.

      Esses providers são consumidos em:
        - `apps/web/src/app/api/ai/chat/route.ts` (chama `getModel(...)` em `streamText`).
        - `apps/web/src/app/api/ai/models/route.ts` (filtra `AI_MODELS`).
        - `apps/web/src/lib/ai/classify-intent.ts` (chama `getModel("claude-haiku-4-5")`).
        - `apps/web/src/components/workspace/config/WorkspaceAiConfig.tsx` (renderiza lista hardcoded dos 4 modelos).
        - `apps/web/src/app/[workspaceSlug]/settings/ai/page.tsx`.

      Os 2 providers já estão integrados e funcionando, mas a abstração é fraca: adicionar um terceiro provider hoje exige editar 3+ lugares (criar arquivo de provider, editar `models.ts`, atualizar UI). A `AiModelDefinition` não tem `capabilities` (tool calling? vision?), não tem `contextWindow`, não tem `cost`, não tem `inputModalities`. Config é lido direto de `process.env` (escopo global, não por workspace).

      ## Objetivo

      Introduzir uma abstração `ProviderDefinition<C>` declarativa — cada provider vira um objeto com metadata rica (capabilities, lista de modelos, config tipado via zod, ícone, etc.) plugado num `providerRegistry` central. A interface pública de `models.ts` (`AI_MODELS`, `getModel`, `getAvailableModels`, `DEFAULT_MODEL_ID`, `AiProvider`, `AiModelDefinition`) deve permanecer 100% compatível com o que existe hoje — nenhum outro arquivo do projeto pode quebrar.

      ## Mudanças

      1. **Criar `apps/web/src/lib/ai/providers/types.ts`** com as interfaces a seguir. Use zod pra tipar config. O `ProviderDefinition` deve ser genérico em `C extends z.ZodTypeAny`.

         ```ts
         import type { LanguageModel } from "ai";
         import type { z } from "zod";

         export interface ProviderCapabilities {
           toolCalling: boolean;
           vision: boolean;
           streaming: boolean;
           structuredOutput: boolean;
           jsonMode: boolean;
           systemPrompt: boolean;
           parallelToolCalls: boolean;
         }

         export type Modality = "text" | "image" | "audio" | "pdf";

         export interface ModelMetadata {
           id: string;
           label: string;
           description?: string;
           contextWindow: number;
           maxOutputTokens: number;
           inputModalities: Modality[];
           outputModalities: Modality[];
           costPer1kInput?: number;
           costPer1kOutput?: number;
           supportsTools?: boolean;
           deprecated?: boolean;
         }

         export type ProviderConfigSchema = z.ZodTypeAny;

         export interface ProviderDefinition<C extends ProviderConfigSchema = ProviderConfigSchema> {
           id: string;                          // 'anthropic' | 'minimax' | ...
           name: string;                        // 'Anthropic' (UI)
           icon?: string;
           configSchema: C;
           defaultConfig: () => z.infer<C>;
           isConfigured: (config: z.infer<C>) => boolean;
           buildModel: (modelId: string, config: z.infer<C>) => LanguageModel;
           listModels?: (config: z.infer<C>) => Promise<ModelMetadata[]>;
           capabilities: ProviderCapabilities;
           staticModels?: readonly ModelMetadata[];  // metadata conhecida sem precisar de API call
         }
         ```

         Exporte também `type InferProviderConfig<P>` etc. só se fizer sentido — mantenha enxuto.

      2. **Migrar `apps/web/src/lib/ai/providers/anthropic.ts`** para o novo formato. Exporte `anthropicProvider: ProviderDefinition<typeof anthropicConfigSchema>`. O `configSchema` deve validar `apiKey` (string min 1) e `baseURL` (URL opcional). O `defaultConfig` lê `process.env.ANTHROPIC_API_KEY` e `process.env.ANTHROPIC_BASE_URL`. `isConfigured` checa `apiKey`. `buildModel` usa `createAnthropic({ apiKey, baseURL })(modelId)`. `capabilities`: tudo true exceto coisas que Claude não suporta (pesquise: claude-sonnet-4-6 tem tool calling, vision, structured output, system prompt, parallel tool calls; json mode também). `staticModels` deve listar os 2 modelos hoje existentes no `AI_MODELS`: `claude-sonnet-4-6` (200k context, 8192 max output, input [text, image], output [text], cost 0.003/0.015) e `claude-haiku-4-5-20251001` (200k context, 8192 max output, input [text, image], output [text], cost 0.0008/0.004 — confirme valores). `label` e `description` devem ser os mesmos do `AI_MODELS` atual.

      3. **Migrar `apps/web/src/lib/ai/providers/minimax.ts`** para o novo formato. Exporte `minimaxProvider: ProviderDefinition<typeof minimaxConfigSchema>`. `configSchema`: `apiKey` (min 1) e `baseURL` (URL opcional, default `https://api.minimax.io/anthropic/v1`). `defaultConfig` lê `process.env.MINIMAX_API_KEY` e `process.env.MINIMAX_BASE_URL`. `isConfigured` = isMinimaxAvailable. `buildModel` usa `createAnthropic({ apiKey, baseURL })(modelId)` (igual ao atual). `capabilities`: mesmo do Anthropic (é um clone via baseURL). `staticModels` lista `MiniMax-M2.7` e `MiniMax-M2.7-highspeed` (os mesmos labels/descrições do `AI_MODELS` atual — use as descrições que já estão em `models.ts` linhas 37-46).

      4. **Criar `apps/web/src/lib/ai/providers/registry.ts`**:

         ```ts
         import type { LanguageModel } from "ai";
         import { anthropicProvider } from "./anthropic";
         import { minimaxProvider } from "./minimax";
         import type { ModelMetadata, ProviderDefinition } from "./types";

         export const providerRegistry = [
           anthropicProvider,
           minimaxProvider,
         ] as const satisfies readonly ProviderDefinition[];

         export type ProviderId = (typeof providerRegistry)[number]["id"];

         export function getProvider(id: string): ProviderDefinition {
           const p = providerRegistry.find((p) => p.id === id);
           if (!p) {
             throw new Error(
               `Provider "${id}" não registrado. Registrados: ${providerRegistry.map((p) => p.id).join(", ")}.`,
             );
           }
           return p as ProviderDefinition;
         }

         export function listProviders(): readonly ProviderDefinition[] {
           return providerRegistry;
         }

         export interface ResolveModelOptions {
           providerId: string;
           modelId: string;
           config?: Record<string, unknown>;
         }

         export function resolveModel(opts: ResolveModelOptions): {
           model: LanguageModel;
           metadata?: ModelMetadata;
         } {
           const provider = getProvider(opts.providerId);
           const config = { ...provider.defaultConfig(), ...(opts.config ?? {}) };
           return {
             model: provider.buildModel(opts.modelId, config),
             metadata: provider.staticModels?.find((m) => m.id === opts.modelId),
           };
         }
         ```

      5. **Adaptar `apps/web/src/lib/ai/models.ts`** para derivar `AI_MODELS` do registry. A forma recomendada:

         ```ts
         import type { LanguageModel } from "ai";
         import { providerRegistry } from "./providers/registry";
         import type { ModelMetadata } from "./providers/types";

         export type AiProvider = (typeof providerRegistry)[number]["id"];

         export interface AiModelDefinition {
           id: string;
           provider: AiProvider;
           label: string;
           description: string;
           isAvailable: () => boolean;
           build: () => LanguageModel;
           metadata?: ModelMetadata;  // NOVO campo, opcional; populado quando vem de staticModels
         }

         function flattenRegistry(): AiModelDefinition[] {
           const result: AiModelDefinition[] = [];
           for (const provider of providerRegistry) {
             const config = provider.defaultConfig();
             for (const model of provider.staticModels ?? []) {
               if (model.deprecated) continue;
               result.push({
                 id: model.id,
                 provider: provider.id as AiProvider,
                 label: model.label,
                 description: model.description ?? "",
                 isAvailable: () => provider.isConfigured(config),
                 build: () => provider.buildModel(model.id, config),
                 metadata: model,
               });
             }
           }
           return result;
         }

         export const AI_MODELS: readonly AiModelDefinition[] = flattenRegistry();

         export const DEFAULT_MODEL_ID = "claude-sonnet-4-6";

         export function getAvailableModels(): readonly AiModelDefinition[] {
           return AI_MODELS.filter((m) => m.isAvailable());
         }

         export function getModel(id?: string | null): AiModelDefinition {
           const available = getAvailableModels();
           return (
             available.find((m) => m.id === id) ??
             available.find((m) => m.id === DEFAULT_MODEL_ID) ??
             available[0]
           );
         }
         ```

         A forma exata de `flattenRegistry` pode ser ajustada (ex: usar `isAvailable` como função que pega o config atual cada vez, em vez de capturar no momento da construção), desde que:
         - Os mesmos 4 modelos apareçam com os mesmos `id` exatos: `claude-sonnet-4-6`, `claude-haiku-4-5`, `minimax-m2.7`, `minimax-m2.7-highspeed`. (Note: o `claude-haiku-4-5` no `models.ts` atual tem id `claude-haiku-4-5` mas usa `claude-haiku-4-5-20251001` no build. Preserve esse mapeamento: o `id` no AI_MODELS continua `claude-haiku-4-5`, e o `buildModel` é chamado com `claude-haiku-4-5-20251001`. Solução: use `id` e `modelId` separados no `ModelMetadata` se precisar, ou use um `aliases` map.)
         - `getModel`, `getAvailableModels`, `DEFAULT_MODEL_ID` mantenham a mesma assinatura e semântica.
         - `AiProvider` seja `string` (não literal union) — isso é OK porque é compatível com o uso existente.

      ## Restrições

