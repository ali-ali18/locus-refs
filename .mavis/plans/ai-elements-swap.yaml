    title: 'Trocar componentes custom do chat por ai-sdk-elements (Conversation/Message/Reasoning/Plan/Tool/PromptInput)'
    assigned_to: coder
    verified_by: [verifier, agent-6d2b54cbda91, agent-df05be33f223]
    timeout_ms: 1800000
    prompt: |
      ## Objetivo

      Substituir os 4 componentes custom do chat pelos oficiais do Vercel AI SDK Elements, mantendo a lógica de domínio (note chip, model picker, apply tool na nota) e zero mudança no backend.

      ## Contexto do projeto

      - Worktree: `C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6`
      - App: `apps/web` (Next.js 16, shadcn/ui em cima de Base UI, Tailwind v4, Vercel AI SDK v6 com `@ai-sdk/react@3.0.193`)
      - Tema: dark mode. Cores via tokens semânticos do `apps/web/src/app/globals.css` (bg-background, text-foreground, bg-primary, etc). **NUNCA hardcode cores** tipo `bg-blue-500`.
      - Border radius: `rounded-xl` por padrão, `rounded-full` pra avatares/pills.
      - Path alias: `@/*` -> `./src/*`.

      ## Componentes atuais (4 arquivos a refatorar)

      - `apps/web/src/components/chat/ChatMessages.tsx` (201 linhas) — renderiza user bubble (bg-primary, right) e AI bubble (bg-sidebar-accent, left) + ChatToolCard pra tool calls
      - `apps/web/src/components/chat/ChatToolCard.tsx` (197 linhas) — card com preview markdown + botões Descartar/Aplicar
      - `apps/web/src/components/chat/ChatInput.tsx` (176 linhas) — input group com chip de nota, model dropdown, botão de enviar
      - `apps/web/src/components/chat/ChatPanel.tsx` — painel geral que compõe os 3 acima

      ## Componentes Vercel (ai-sdk-elements) a usar

      Documentação oficial: https://elements.ai-sdk.dev

      Substituições:
      1. `ChatMessages.tsx` -> `<Conversation>` + `<ConversationContent>` + `<ConversationScrollButton>` + `<Message from={role}>` + `<MessageContent>` + `<MessageResponse>`
      2. `ChatToolCard.tsx` (edit proposal) -> `<Plan>` + `<PlanHeader>` + `<PlanTitle>` + `<PlanDescription>` + `<PlanContent>` + `<PlanAction>` (com botões Aceitar/Recusar no footer)
      3. Reasoning/loading (não existe, criar) -> `<Reasoning>` + `<ReasoningTrigger>` + `<ReasoningContent>` com `isStreaming` prop
      4. `ChatInput.tsx` -> `<PromptInput>` + `<PromptInputHeader>` + `<PromptInputBody>` + `<PromptInputTextarea>` + `<PromptInputFooter>` + `<PromptInputTools>` + `<PromptInputSelect>` (model) + `<PromptInputSubmit>`
      5. Tool calls genéricos (futuro, opcional) -> `<Tool>` (4 estados built-in)

      ## Install (registry shadcn)

      Tente primeiro o install via shadcn CLI:
      ```bash
      pnpm dlx shadcn@latest add https://elements.ai-sdk.dev/r/conversation.json
      pnpm dlx shadcn@latest add https://elements.ai-sdk.dev/r/message.json
      pnpm dlx shadcn@latest add https://elements.ai-sdk.dev/r/reasoning.json
      pnpm dlx shadcn@latest add https://elements.ai-sdk.dev/r/plan.json
      pnpm dlx shadcn@latest add https://elements.ai-sdk.dev/r/tool.json
      pnpm dlx shadcn@latest add https://elements.ai-sdk.dev/r/prompt-input.json
      ```

      Se o registry path falhar (404, schema mismatch), faça fallback manual:
      1. Leia cada componente de `https://elements.ai-sdk.dev/components/{name}` e copie o código pra `apps/web/src/components/ai-elements/{name}.tsx`
      2. Instale as peer deps que o shadcn normalmente puxa (radix-ui primitives, streamdown, etc.) — use `pnpm add` se faltar
      3. Ajuste imports se necessário

      **Documente no `deliverable.md` qual abordagem funcionou (CLI ou manual) e os commits feitos.**

      ## Requisitos do usuário (verbatim, não negocie nenhum)

      - AI message **sem background**, só bg natural da aplicação (sem rounded-bl-sm, sem border)
      - User message **mantém tudo igual** (bg-primary, rounded-br-sm, right-aligned)
      - Reasoning/loading: ícone de cérebro (lucide-react `Brain` ou o que vier built-in no componente) + texto do reasoning visível durante streaming, colapsa sozinho no fim
      - "Aceitar ou recusar" pra edit proposals: usa `<Plan>` com `<PlanAction>` no footer; quando o LLM propôs uma edit (`input-available`), renderiza o Plan inline na conversa com 2 botões
      - Manter zero mudança no backend: `apps/web/src/app/api/ai/chat/route.ts` e `apps/web/src/app/api/ai/models/route.ts` não são tocados
      - Manter `useChat` do `@ai-sdk/react` (já tá sendo usado)
      - Manter `applyToolOperation` no `useNoteEditor` (lógica de aplicar tool na nota)
      - Manter note chip (vai como `<PromptInputHeader>` addon)
      - Manter model picker (vai como `<PromptInputSelect>`, lê do hook `useAiModels`)

      ## Restrições

      - **NÃO modificar** arquivos fora de `apps/web/src/components/chat/` e `apps/web/src/components/ai-elements/` (novo) e `apps/web/src/components/ui/` (se precisar de primitivos novos). Em particular, preserve:
        - `apps/web/src/app/api/ai/chat/route.ts`
        - `apps/web/src/app/api/ai/models/route.ts`
        - `apps/web/src/lib/ai/**` (registry, tools, models, providers)
        - `apps/web/src/context/noteEditor.tsx` (só importe/use, não modifique)
        - `apps/web/src/components/chat/ChatHeader.tsx` (sem mudança)
        - `apps/web/src/components/chat/ButtonChatPanel.tsx` (sem mudança)
        - `apps/web/src/components/chat/ChatModelSelector.tsx` (se existir duplicado, remova só depois de confirmar que ninguém mais importa)
        - `apps/web/src/hook/ai/**` (hooks de AI settings, sem mudança)
      - Sem dependências novas além das que o ai-sdk-elements requer (radix-ui, streamdown, etc.)
      - Sem supressões de lint desnecessárias; siga o biome
      - `useChat` já é usado em `apps/web/src/components/chat/hook/useAiChat.ts` — adapte o que precisar mas não reescreva do zero a menos que necessário
      - Cores: **NUNCA** hardcode. Use tokens semânticos (bg-background, text-foreground, etc.) do globals.css
      - Border radius: `rounded-xl` padrão

      ## Custom a preservar (lógica de domínio)

      - NoteChip: o componente que mostra o título da nota anexada (já existe em ChatInput.tsx) — vira um addon dentro de `<PromptInputHeader>` ou `<PromptInputFooter>`
      - ModelDropdown: lê do `useAiModels()` (já existe hook), popula `<PromptInputSelect>` com `models.map(...)`
      - Apply tool: quando usuário clica "Aceitar" no Plan, chama `useNoteEditor().applyToolOperation(noteId, op)` e `onResolve(toolCallId, ...)` — a lógica de aplicar e resolver tá no `useNoteEditor` context
      - Streaming: `useChat` retorna `status` — mapear pra `isStreaming` que vai pros componentes do ai-elements

      ## Validação (rode no fim e reporte)

      1. `cd C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6 && pnpm exec tsc --noEmit -p apps/web/tsconfig.json` — 0 erros
      2. `cd C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6 && pnpm exec biome check apps/web/src/components/chat apps/web/src/components/ai-elements` — 0 erros (formate antes com `pnpm exec biome format --write` se precisar)
      3. `cd C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6 && pnpm test:run` — testes existentes passam (102 é o baseline; 3 falhas pré-existentes em notes/collection são aceitas, NÃO introduza novas)
      4. `cd C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6 && pnpm build` — build limpa (opcional mas recomendado se sobrar tempo)
      5. `git status --short` e `git diff --stat` — confirme que mudanças estão apenas nos 4-5 arquivos esperados

      ## Entrega

      - 1 commit na branch atual com mensagem descritiva (ex: `refactor(chat): migrate to ai-sdk-elements`). NÃO push.
      - Escreva `deliverable.md` em `C:\Dev\Personal\locus-refs\.worktrees\wt-5d6a56e6\.mavis\plans\ai-elements-swap\impl-deliverable.md` com:
        - Abordagem de install usada (shadcn CLI ou manual) e por quê
        - Lista de componentes ai-elements adicionados e onde estão
        - Hash do commit
        - Resultado dos 4-5 comandos de validação
        - Quaisquer decisões de design (ex: onde o "Aceitar/Recusar" ficou, como o note chip integrou, se usou `defaultOpen` no Plan ou não)
        - Quaisquer divergências deste prompt e o porquê
