packages:
  - 'apps/*'
  - 'packages/*'

nodeLinker: hoisted

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  "@parcel/watcher": true
  msw: true
  sharp: true
  workerd: true
  "@prisma/client": true
  unrs-resolver: true

# pnpm 11 default: bloqueia pacotes < 24h (quebra Docker/CI com lockfile recente)
minimumReleaseAgeExclude:
  - "@types/pg"
  - terser
  - "@hocuspocus/common"
  - "@hocuspocus/extension-database"
  - "@hocuspocus/provider"
  - "@hocuspocus/server"


